<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ostrich Team — Tablero de Proyectos</title>
  <link rel="icon" type="image/svg+xml" href="./src/assets/images/svg/ostrich-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/tokens.css" />
  <link rel="stylesheet" href="./src/css/layout.css" />
  <link rel="stylesheet" href="./src/css/components.css" />
</head>
<body>
  <!-- PANTALLA DE ACCESO -->
  <main id="lockScreen" class="lock-screen">
    <section class="lock-card" aria-label="Acceso al tablero">
      <div class="lock-card-banner">
        <span class="lock-stamp">ARCHIVO INTERNO</span>
        <span class="lock-stamp">AES-256</span>
      </div>
      <div class="lock-body">
        <div class="lock-brand">
          <img src="./src/assets/images/svg/ostrich-logo.svg" alt="Ostrich Team" />
          <div>
            <h1 class="lock-title">Ostrich Team</h1>
            <p class="lock-subtitle">Tablero de propuestas</p>
          </div>
        </div>

        <form id="loginForm" class="lock-form" autocomplete="off">
          <div class="form-field">
            <label for="passwordInput" class="form-label">Clave de equipo</label>
            <input
              id="passwordInput"
              class="form-input"
              type="password"
              placeholder="Introduce la clave"
              required
              autofocus
            />
          </div>

          <div id="loginError" class="form-error hidden" role="alert"></div>

          <button type="submit" id="loginBtn" class="btn btn-primary">
            Desbloquear tablero
          </button>
        </form>

        <div class="lock-footer">
          <span id="vaultModeLabel">Boveda lista</span>
          <a href="./src/html/setup.html">Configurar repo</a>
        </div>
      </div>
    </section>
  </main>

  <!-- APLICACION PRINCIPAL -->
  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand-mark">
          <img src="./src/assets/images/svg/ostrich-logo.svg" alt="Ostrich Team" />
          <div>
            <h1 class="brand-name">Ostrich Team</h1>
            <div class="brand-tag">TABLERO DE EXPEDIENTES</div>
          </div>
        </div>
        <div id="syncPill" class="sync-pill" data-state="demo" title="Estado de sincronizacion">
          <span class="sync-dot"></span>
          <span id="syncText">Local</span>
        </div>
      </div>

      <div class="topbar-controls">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
          </svg>
          <input id="searchInput" type="search" placeholder="Buscar caso o juego ref..." />
        </div>

        <select id="ownerFilter" class="filter-select" aria-label="Filtrar por responsable">
          <option value="all">Todo el equipo</option>
        </select>

        <button id="syncBtn" type="button" class="btn" title="Sincronizar ahora">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Sync</span>
        </button>

        <button id="newProjectBtn" type="button" class="btn btn-accent">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>Nuevo caso</span>
        </button>

        <a href="./src/html/setup.html" class="btn btn-icon" title="Configurar repositorio privado">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06-2 2-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21h-3v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06-2-2 .06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3v-3h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06 2-2 .06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3h3v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06 2 2-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21v3h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </a>

        <button id="logoutBtn" type="button" class="btn btn-icon" title="Bloquear sesion">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
            <rect x="3" y="11" width="18" height="11" rx="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>
    </header>

    <main class="board-wrap">
      <div id="kanbanBoard" class="kanban-board" aria-label="Tablero Kanban de proyectos"></div>
    </main>
  </div>

  <!-- MODAL DE EXPEDIENTE -->
  <div id="projectModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <div class="modal-header">
        <h2 id="modalTitle" class="modal-header-title">Expediente</h2>
        <button id="closeModalBtn" type="button" class="btn btn-icon" aria-label="Cerrar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <form id="projectForm" class="modal-body">
        <input type="hidden" id="fieldId" />

        <div class="form-grid">
          <div class="form-field">
            <label for="fieldTitle" class="form-label">Titulo del proyecto</label>
            <input id="fieldTitle" class="form-input" type="text" placeholder="Ej: Proyecto Sandstorm" required />
          </div>

          <div class="form-field">
            <label for="fieldCode" class="form-label">Codigo</label>
            <input id="fieldCode" class="form-input" type="text" placeholder="EXP-005" required />
          </div>

          <div class="form-field">
            <label for="fieldColumn" class="form-label">Alcance / Columna</label>
            <select id="fieldColumn" class="form-select">
              <option value="ideas">Ideas / Pistas</option>
              <option value="month1">Proyecto 1 Mes</option>
              <option value="month2">Proyecto 2 Meses</option>
              <option value="large">Proyecto Grande</option>
              <option value="archive">Archivo / Notas</option>
            </select>
          </div>

          <div class="form-field">
            <label for="fieldDate" class="form-label">Fecha estimada</label>
            <input id="fieldDate" class="form-input" type="month" />
          </div>

          <div class="form-field">
            <label for="fieldOwner" class="form-label">Responsables</label>
            <input id="fieldOwner" class="form-input" type="text" placeholder="Ej: Pau, Alex" />
          </div>

          <div class="form-field">
            <label for="fieldRefs" class="form-label">Juegos de referencia (separados por coma)</label>
            <input id="fieldRefs" class="form-input" type="text" placeholder="Hollow Knight, Tunic, Balatro" />
          </div>

          <div class="form-field full">
            <label for="fieldPitch" class="form-label">Descripcion / Concepto</label>
            <textarea id="fieldPitch" class="form-textarea" placeholder="Premisa, mecanica principal y notas clave..."></textarea>
          </div>

          <div class="form-field full">
            <span class="form-label">Imagenes de referencia</span>
            <div id="uploadZone" class="upload-zone">
              <span class="upload-hint">Sube imagenes o pega con Ctrl+V</span>
              <div>
                <input id="imageFileInput" type="file" accept="image/*" multiple class="hidden" />
                <button id="selectImagesBtn" type="button" class="btn">Subir imagen</button>
              </div>
            </div>
            <div id="galleryGrid" class="gallery-grid"></div>
          </div>
        </div>
      </form>

      <div class="modal-footer">
        <button id="deleteProjectBtn" type="button" class="btn btn-danger hidden">Eliminar</button>
        <div class="modal-footer-actions">
          <button id="cancelModalBtn" type="button" class="btn">Cancelar</button>
          <button id="saveProjectBtn" type="submit" form="projectForm" class="btn btn-primary">Guardar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX DE IMAGEN -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Vista ampliada">
    <div class="lightbox-inner">
      <button id="closeLightboxBtn" type="button" class="lightbox-close" aria-label="Cerrar imagen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <img id="lightboxImg" src="" alt="Referencia ampliada" />
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
