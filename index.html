<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ostrich Team — Catalogo de Proyectos</title>
  <link rel="icon" type="image/svg+xml" href="./src/assets/images/svg/ostrich-logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./src/css/tokens.css" />
  <link rel="stylesheet" href="./src/css/layout.css" />
  <link rel="stylesheet" href="./src/css/components.css" />
</head>
<body>
  <!-- PANTALLA DE ACCESO -->
  <main id="lockScreen" class="lock-screen">
    <section class="lock-card" aria-label="Acceso privado">
      <div class="lock-brand">
        <img src="./src/assets/images/svg/ostrich-logo.svg" alt="Ostrich Team" />
        <div>
          <h1 class="lock-title">Ostrich Team</h1>
          <p class="lock-subtitle">Catalogo de proyectos</p>
        </div>
      </div>

      <form id="loginForm" class="lock-form" autocomplete="off">
        <div class="form-field">
          <label for="passwordInput" class="form-label">Clave de acceso</label>
          <input
            id="passwordInput"
            class="form-input"
            type="password"
            placeholder="Introduce la clave"
            required
            autofocus
          />
        </div>

        <div id="loginError" class="form-error hidden" role="alert"></div>

        <button type="submit" id="loginBtn" class="btn btn-primary">
          Entrar
        </button>
      </form>
    </section>
  </main>

  <!-- CATALOGO PRINCIPAL -->
  <div id="appShell" class="app-shell hidden">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          <div class="brand-mark">
            <img src="./src/assets/images/svg/ostrich-logo.svg" alt="Ostrich Team" />
            <h1 class="brand-name">Ostrich Team</h1>
          </div>
          <div id="syncPill" class="sync-pill" data-state="demo" title="Estado de sincronizacion">
            <span class="sync-dot"></span>
            <span id="syncText">Local</span>
          </div>
        </div>

        <div class="topbar-actions">
          <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="20" y1="20" x2="16.2" y2="16.2"></line>
            </svg>
            <input id="searchInput" type="search" placeholder="Buscar juego o referencia..." />
          </div>

          <button id="syncBtn" type="button" class="btn" title="Actualizar ahora">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <polyline points="23 4 23 10 17 10"></polyline>
              <polyline points="1 20 1 14 7 14"></polyline>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            <span>Actualizar</span>
          </button>

          <button id="newProjectBtn" type="button" class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>Nuevo juego</span>
          </button>

          <button id="logoutBtn" type="button" class="btn btn-icon" title="Cerrar sesion">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main class="catalog-wrap">
      <div class="filter-bar">
        <div id="categoryTabs" class="category-tabs" role="tablist" aria-label="Filtrar por alcance"></div>
        <span id="catalogCount" class="catalog-count"></span>
      </div>

      <section id="gamesGrid" class="games-grid" aria-label="Lista de propuestas"></section>
    </main>
  </div>

  <!-- MODAL DE JUEGO (VISTA DETALLE STEAM + MODO EDICION) -->
  <div id="projectModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-panel">
      <header class="modal-header">
        <h2 id="modalTitle" class="modal-header-title">Juego</h2>
        <div class="modal-header-actions">
          <button id="editModeBtn" type="button" class="btn" title="Editar proyecto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
              <path d="M12 20h9"></path>
              <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
            </svg>
            <span>Editar</span>
          </button>
          <button id="closeModalBtn" type="button" class="btn btn-icon" aria-label="Cerrar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </header>

      <!-- MODO LECTURA (PAGINA DE JUEGO) -->
      <div id="detailView" class="modal-body">
        <div class="detail-grid">
          <div>
            <div class="detail-media">
              <div id="detailHeroWrap" class="hero-frame">
                <img id="detailHeroImg" src="" alt="" />
              </div>
              <div id="detailThumbStrip" class="thumb-strip"></div>
            </div>

            <div class="detail-section">
              <h3 class="detail-section-title">Descripcion</h3>
              <p id="detailPitch" class="detail-description"></p>
            </div>

            <div id="detailGoalsSection" class="detail-section">
              <h3 class="detail-section-title">Objetivos</h3>
              <ul id="detailGoals" class="goals-list"></ul>
            </div>
          </div>

          <aside class="detail-sidebar">
            <div class="spec-row">
              <span class="spec-label">Precio lanzamiento</span>
              <span id="detailPrice" class="price-box"></span>
            </div>
            <div class="spec-row">
              <span class="spec-label">Tiempo estimado</span>
              <span id="detailScope" class="scope-badge"></span>
            </div>
            <div class="spec-row">
              <span class="spec-label">Fecha estimada</span>
              <span id="detailDate" class="spec-value"></span>
            </div>
            <div class="spec-row">
              <span class="spec-label">Modo</span>
              <span id="detailMode" class="spec-value"></span>
            </div>

            <div id="detailRefsBlock">
              <h3 class="detail-section-title">Juegos de referencia</h3>
              <div id="detailRefs" class="tags-wrap"></div>
            </div>

            <div id="detailLinksBlock">
              <h3 class="detail-section-title">Enlaces</h3>
              <div id="detailLinks" class="links-list"></div>
            </div>
          </aside>
        </div>
      </div>

      <!-- MODO EDICION -->
      <form id="projectForm" class="modal-body hidden">
        <input type="hidden" id="fieldId" />

        <div class="form-grid">
          <div class="form-field full">
            <label for="fieldTitle" class="form-label">Titulo</label>
            <input id="fieldTitle" class="form-input" type="text" placeholder="Nombre del juego o idea" required />
          </div>

          <div class="form-field">
            <label for="fieldColumn" class="form-label">Tiempo estimado</label>
            <select id="fieldColumn" class="form-select">
              <option value="ideas">Idea</option>
              <option value="month1">1 Mes</option>
              <option value="month2">2 Meses</option>
              <option value="large">Proyecto Grande</option>
              <option value="archive">Archivo</option>
            </select>
          </div>

          <div class="form-field">
            <label for="fieldPrice" class="form-label">Precio lanzamiento</label>
            <input id="fieldPrice" class="form-input" type="text" placeholder="Ej: 9,99 € o Gratis" />
          </div>

          <div class="form-field">
            <label for="fieldDate" class="form-label">Fecha objetivo</label>
            <input id="fieldDate" class="form-input" type="month" />
          </div>

          <div class="form-field">
            <label for="fieldMode" class="form-label">Modo</label>
            <input id="fieldMode" class="form-input" type="text" placeholder="Online PvP, Offline, Co-op..." />
          </div>

          <div class="form-field full">
            <label for="fieldRefs" class="form-label">Juegos de referencia (separados por coma)</label>
            <input id="fieldRefs" class="form-input" type="text" placeholder="Plants vs. Zombies, Pico Park..." />
          </div>

          <div class="form-field full">
            <label for="fieldPitch" class="form-label">Descripcion</label>
            <textarea id="fieldPitch" class="form-textarea" placeholder="De que trata el juego, mecanicas clave..."></textarea>
          </div>

          <div class="form-field full">
            <label for="fieldGoals" class="form-label">Objetivos (uno por linea)</label>
            <textarea id="fieldGoals" class="form-textarea" placeholder="Prototipo jugable en 2 semanas&#10;Demo en Steam Next Fest"></textarea>
          </div>

          <div class="form-field full">
            <label for="fieldLinks" class="form-label">Enlaces de referencia (uno por linea: Nombre | https://... o solo URL)</label>
            <textarea id="fieldLinks" class="form-textarea" placeholder="Steam Ref | https://store.steampowered.com/..."></textarea>
          </div>

          <div class="form-field full">
            <span class="form-label">Imagenes (la primera sera la portada)</span>
            <div id="uploadZone" class="upload-zone">
              <span class="upload-hint">Sube imagenes o pega con Ctrl+V</span>
              <div>
                <input id="imageFileInput" type="file" accept="image/*" multiple class="hidden" />
                <button id="selectImagesBtn" type="button" class="btn">Subir imagen</button>
              </div>
            </div>
            <div id="galleryGrid" class="gallery-grid"></div>
          </div>
        </div>
      </form>

      <footer id="editFooter" class="modal-footer hidden">
        <button id="deleteProjectBtn" type="button" class="btn btn-danger hidden">Eliminar</button>
        <div class="modal-footer-actions">
          <button id="cancelEditBtn" type="button" class="btn">Cancelar</button>
          <button id="saveProjectBtn" type="submit" form="projectForm" class="btn btn-primary">Guardar</button>
        </div>
      </footer>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Vista ampliada">
    <div class="lightbox-inner">
      <button id="closeLightboxBtn" type="button" class="lightbox-close" aria-label="Cerrar imagen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
      <img id="lightboxImg" src="" alt="Referencia ampliada" />
    </div>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

  <script type="module" src="./src/js/main.js"></script>
</body>
</html>
